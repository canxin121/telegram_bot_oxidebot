[package]
name = "telegram_bot_oxidebot"
version = "0.1.3"
edition = "2021"
description = "Telegram Bot for oxidebot framework"
license = "MIT OR Apache-2.0"
authors = ["canxin121 <q1969730106@gmail.com>"]
homepage = "https://github.com/canxin121/telegram_bot_oxidebot"
repository = "https://github.com/canxin121/telegram_bot_oxidebot"
readme = "Readme.md"
keywords = ["bot", "chatbot", "oxidebot"]
categories = ["science::robotics", "api-bindings"]


[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["clock"] }
hyper = "1.11.0"
mime_guess = "2.0.5"
oxidebot = { version = "0.1.7", path = "../oxidebot" }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "multipart",
    "rustls",
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tracing = "0.1.44"
